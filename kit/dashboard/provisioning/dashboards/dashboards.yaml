# Dashboard provisioning: everything under /var/lib/grafana/dashboards is
# loaded from files, so the container holds no saved state (its disk is wiped
# when it sleeps). That covers kit/dashboard/dashboards/base.json (the kit
# base dashboard) and the clone's own dashboards/*.json extras, which the
# Dockerfile copies next to it. Design in Grafana, export the JSON, commit,
# deploy: edits made in the UI are lost on sleep.
apiVersion: 1
providers:
  - name: kit
    folder: MCP
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
