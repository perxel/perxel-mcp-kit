# Data source provisioning for the MCP dashboard (section 3.12).
#
# The ClickHouse plugin talks to the metrics proxy (kit/metrics-proxy), never
# to Cloudflare directly: the proxy holds the only account-wide Analytics
# Engine token and scopes each key to one dataset.
#
# Runtime env (passed into the container by kit/dashboard/worker.ts):
#   PROXY_URL  this client's metrics-proxy URL
#   PROXY_KEY  this dashboard's key (sent as an Authorization header, the
#              preferred auth; the proxy also accepts it as the basic-auth
#              password field, but the header below is what we use).
# `$__env{...}` interpolation is Grafana's documented provisioning syntax.
apiVersion: 1
datasources:
  - name: MetricsProxy
    uid: metricsproxy
    type: vertamedia-clickhouse-datasource
    access: proxy
    url: $__env{PROXY_URL}
    basicAuth: false
    isDefault: true
    editable: false
    jsonData:
      # POST the SQL like the Analytics Engine SQL API expects (the proxy
      # accepts GET ?query= too, for curl checks).
      usePOST: true
      # Custom header carrying the dashboard key (Grafana core feature for
      # proxied data sources; value lives in secureJsonData so it never
      # appears in the provisioned JSON).
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Bearer $__env{PROXY_KEY}
